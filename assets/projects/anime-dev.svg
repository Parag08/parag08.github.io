<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="t d">
<title id="t">Anime developer at work</title>
<desc id="d">An original anime-style character with dark hair, bangs and a vermilion hair tie, wearing an indigo hoodie, sits cross-legged on a zabuton cushion typing on a laptop, with a steaming cup of tea beside them.</desc>
<style>
.bb{fill:none}
.piv{transform-box:fill-box;transform-origin:40px 40px}
.tail{animation:sway 3.6s ease-in-out infinite alternate}
.lock{animation:sway 2.8s ease-in-out infinite alternate-reverse}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,97%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.1)}}
.handA{animation:type .32s ease-in-out infinite alternate}
.handB{animation:type .28s ease-in-out infinite alternate-reverse}
@keyframes type{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}
.glow{animation:glow 3.5s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.6}to{opacity:1}}
.steam{animation:steam 3s ease-out infinite}
@keyframes steam{0%{transform:translateY(4px);opacity:0}35%{opacity:.8}100%{transform:translateY(-12px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
